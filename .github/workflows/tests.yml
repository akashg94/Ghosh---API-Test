name: API tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 12 * * *"   # daily run catches upstream API changes
  workflow_dispatch:

jobs:
  stubbed:
    name: Stubbed + contract tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -m "not live" -v

  live:
    name: Live tests (real PokeAPI)
    runs-on: ubuntu-latest
    needs: stubbed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -m live -v
